name: settlement-regression

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Release gate: fails the build if the suite stops catching the faulty
      # implementation OR if the shipped implementation fails any case.
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/
